<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Rental</title>
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url('images/orange-background.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        .form-card {
            max-width: 440px;
            width: 100%;
            border-radius: 18px !important;
            background-color: #ffffff;
        }

        .form-title {
            color: #1e0a3c;
            font-size: 1.4rem;
        }

        .form-control, .form-select {
            border-color: #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 0.25rem rgba(255, 0, 0, 0.15);
            border-color: #ff0000;
        }

        .btn-search {
            background-color: #ff0000;
            color: #ffffff;
            border: none;
            border-radius: 25px;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .btn-search:hover {
            background-color: #d60000;
            color: #ffffff;
        }

        .features-list {
            font-size: 0.85rem;
            color: #1e0a3c;
            line-height: 1.6;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <main class="d-flex justify-content-center align-items-center min-vh-100 p-3"> 
        <section class="card p-4 border-0 shadow-lg form-card">
            <h3 class="fw-bold mb-4 form-title">Search for a rental car</h3>
            
            <form action="">
                <!-- Pick up location -->
                <div class="form-group mb-3">
                    <label for="location" class="form-label fw-semibold small text-secondary">Pick up location</label>
                    <input type="text" id="location" name="location" class="form-control" placeholder="City, airport, region, district...">
                </div>
               
                <!-- Deliver check -->
                <div class="form-check mb-3">
                    <input type="checkbox" id="deliverElsewhere" class="form-check-input">
                    <label for="deliverElsewhere" class="form-check-label small text-secondary">Deliver the car somewhere else</label>
                </div>

                <!-- Dates Row -->
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label class="form-label fw-semibold small text-secondary mb-1">Date of pickup</label>
                        <input type="date" class="form-control" value="2022-03-26">
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold small text-secondary mb-1">Date of delivery</label>
                        <input type="date" class="form-control" value="2022-03-29">
                    </div>
                </div>

                <!-- Times Row -->
                <div class="row g-2 mb-3">
                    <div class="col-3">
                        <select class="form-select">
                            <option selected>10</option>
                            <option>11</option>
                            <option>12</option>
                        </select>
                    </div>
                    <div class="col-3">
                        <select class="form-select">
                            <option selected>00</option>
                            <option>15</option>
                            <option>30</option>
                        </select>
                    </div>
                    <div class="col-3">
                        <select class="form-select">
                            <option selected>10</option>
                            <option>11</option>
                            <option>12</option>
                        </select>
                    </div>
                    <div class="col-3">
                        <select class="form-select">
                            <option selected>00</option>
                            <option>15</option>
                            <option>30</option>
                        </select>
                    </div>
                </div>

                <!-- Age Check -->
                <div class="form-check mb-3">
                    <input type="checkbox" id="agecheck" name="agecheck" class="form-check-input" checked>
                    <label for="agecheck" class="form-check-label small text-secondary">The driver's age between 30 and 65?</label>
                </div>

                <!-- Features List -->
                <ul class="features-list list-unstyled mb-4">
                    <li>✓ No credit card fees</li>
                    <li>✓ No change fees</li>
                    <li>✓ Price match guarantee</li>
                </ul>
                       
                <!-- Search Button -->
                <button type="submit" class="btn btn-search w-100">Search</button>      
            </form>
        </section>
    </main>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
